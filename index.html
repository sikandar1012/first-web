
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MS Hearts</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    height: 100vh;
    overflow: hidden;
    background: linear-gradient(135deg, #06145f, #102c9c, #1746c5, #07134d);
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
}

.content {
    text-align: center;
    z-index: 10;
    position: relative;
    padding: 20px;
}

h1 {
    color: white;
    font-size: clamp(45px, 8vw, 75px);
    text-shadow: 0 0 15px #8daaff, 0 0 35px #4c75ff;
}

p {
    color: #dce7ff;
    font-size: 18px;
    margin-top: 12px;
    letter-spacing: 2px;
}

.heart {
    position: fixed;
    width: 22px;
    height: 22px;
    background: #ff1744;
    transform: rotate(-45deg);
    animation: float 9s ease-in-out infinite alternate;
    filter: drop-shadow(0 0 5px #ff1744)
            drop-shadow(0 0 12px #ff4268)
            drop-shadow(0 0 22px rgba(255, 23, 68, 0.8));
    z-index: 1;
}

.heart::before,
.heart::after {
    content: "";
    position: absolute;
    width: 22px;
    height: 22px;
    background: inherit;
    border-radius: 50%;
}

.heart::before {
    top: -11px;
    left: 0;
}

.heart::after {
    left: 11px;
    top: 0;
}

.heart span {
    position: absolute;
    z-index: 3;
    transform: rotate(45deg);
    color: white;
    font-size: 8px;
    font-weight: bold;
    top: 5px;
    left: 5px;
}

@keyframes float {
    0% {
        transform: translate(0, 0) rotate(-45deg);
    }
    25% {
        transform: translate(150px, -120px) rotate(-45deg);
    }
    50% {
        transform: translate(-130px, -230px) rotate(-45deg);
    }
    75% {
        transform: translate(180px, 100px) rotate(-45deg);
    }
    100% {
        transform: translate(-160px, 220px) rotate(-45deg);
    }
}
</style>
</head>

<body>

<div class="content">
    <h1>♥ MS ♥</h1>
    <p>Little hearts, endless sweetness</p>
</div>

<script>
const colors = [
    "#ff1744",
    "#ff2d55",
    "#e60039",
    "#ff4569",
    "#d50032"
];

for (let i = 0; i < 40; i++) {
    const heart = document.createElement("div");
    heart.className = "heart";

    const label = document.createElement("span");
    label.textContent = "MS";
    heart.appendChild(label);

    heart.style.left = Math.random() * 100 + "vw";
    heart.style.top = Math.random() * 100 + "vh";

    const size = 12 + Math.random() * 22;
    heart.style.width = size + "px";
    heart.style.height = size + "px";

    const color = colors[Math.floor(Math.random() * colors.length)];
    heart.style.background = color;

    heart.style.animationDuration = (7 + Math.random() * 9) + "s";
    heart.style.animationDelay = (-Math.random() * 12) + "s";
    heart.style.animationDirection = Math.random() > 0.5 ? "alternate" : "alternate-reverse";

    document.body.appendChild(heart);
}
</script>

</body>
</html>
