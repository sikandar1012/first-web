
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MS Hearts ❤️</title>

<style>
    body {
        margin: 0;
        height: 100vh;
        overflow: hidden;
        background: linear-gradient(
            135deg,
            #07152e,
            #102c52,
            #172d50,
            #0b1935
        );
        font-family: Arial, sans-serif;
    }

    /* Glowing background effect */
    body::before {
        content: "";
        position: fixed;
        width: 350px;
        height: 350px;
        background: #493b91;
        filter: blur(140px);
        opacity: 0.25;
        top: 15%;
        left: 30%;
        pointer-events: none;
    }

    .heart {
        position: absolute;
        width: 45px;
        height: 45px;
        background: #ff6b9d;
        transform: rotate(-45deg);
        animation: float 5s infinite ease-in-out;
        box-shadow: 0 0 12px #ff6b9d,
                    0 0 25px rgba(255, 107, 157, 0.6);
    }

    .heart::before,
    .heart::after {
        content: "";
        position: absolute;
        width: 45px;
        height: 45px;
        background: inherit;
        border-radius: 50%;
    }

    .heart::before {
        top: -22px;
        left: 0;
    }

    .heart::after {
        left: 22px;
        top: 0;
    }

    .heart span {
        position: absolute;
        z-index: 2;
        color: white;
        font-size: 12px;
        font-weight: bold;
        transform: rotate(45deg);
        top: 15px;
        left: 12px;
        white-space: nowrap;
        text-shadow: 0 0 5px white;
    }

    @keyframes float {
        0%, 100% {
            translate: 0 0;
        }
        50% {
            translate: 0 -35px;
        }
    }

    .title {
        position: absolute;
        top: 40%;
        width: 100%;
        text-align: center;
        color: #ffb6d0;
        font-size: 42px;
        font-weight: bold;
        text-shadow:
            0 0 10px #ff6b9d,
            0 0 25px #ff6b9d,
            0 0 45px #c65baf;
        z-index: 5;
    }

    .subtitle {
        position: absolute;
        top: 49%;
        width: 100%;
        text-align: center;
        color: #d5c8ff;
        font-size: 17px;
        letter-spacing: 1px;
        text-shadow: 0 0 10px #a78bfa;
        z-index: 5;
    }

</style>
</head>

<body>

<div class="title">♥ MS ♥</div>
<div class="subtitle">Little hearts, endless sweetness</div>

<script>
    const colors = [
        "#ff6b9d",
        "#ff8fab",
        "#d88cff",
        "#b58aff",
        "#ffb6c9"
    ];

    for (let i = 0; i < 35; i++) {

        let heart = document.createElement("div");
        heart.className = "heart";

        heart.innerHTML = "<span>MS</span>";

        heart.style.left = Math.random() * 95 + "%";
        heart.style.top = Math.random() * 90 + "%";

        let size = 0.5 + Math.random() * 0.8;
        heart.style.scale = size;

        let color = colors[
            Math.floor(Math.random() * colors.length)
        ];

        heart.style.background = color;
        heart.style.boxShadow =
            "0 0 12px " + color +
            ", 0 0 25px " + color;

        heart.style.animationDuration =
            (3 + Math.random() * 4) + "s";

        heart.style.animationDelay =
            Math.random() * 4 + "s";

        document.body.appendChild(heart);
    }
</script>

</body>
</html>
